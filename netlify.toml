# Fallback 404 page (only for non-existing routes)
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security Headers to pass Core Web Vitals audits
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"